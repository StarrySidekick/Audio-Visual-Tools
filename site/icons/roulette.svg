<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<title>Chord Roulette</title>
<!-- Home-screen icon art, 1024 square (site/README.md, "Home-screen icons").
     The Ear and Eye family: a flat field in each game's own colour, faint staff
     lines across it, one bold glyph inside the middle circle, gold for the answer.
     A die whose pips are noteheads. -->
<rect width="1024" height="1024" fill="#24211e"/>
<g stroke="#fffdf8" stroke-opacity="0.12" stroke-width="12"><line x1="0" y1="336" x2="1024" y2="336"/><line x1="0" y1="424" x2="1024" y2="424"/><line x1="0" y1="512" x2="1024" y2="512"/><line x1="0" y1="600" x2="1024" y2="600"/><line x1="0" y1="688" x2="1024" y2="688"/></g>
<g transform="translate(512 512) scale(1)">
<g transform="rotate(-12)">
<rect x="-215" y="-215" width="430" height="430" rx="72" fill="#fffdf8"/>
<ellipse cx="-115" cy="-115" rx="50" ry="36" transform="rotate(-22 -115 -115)" fill="#22201d"/>
<ellipse cx="115" cy="-115" rx="50" ry="36" transform="rotate(-22 115 -115)" fill="#22201d"/>
<ellipse cx="0" cy="0" rx="50" ry="36" transform="rotate(-22 0 0)" fill="#22201d"/>
<ellipse cx="-115" cy="115" rx="50" ry="36" transform="rotate(-22 -115 115)" fill="#22201d"/>
<ellipse cx="115" cy="115" rx="50" ry="36" transform="rotate(-22 115 115)" fill="#22201d"/>
</g>
</g>
</svg>
